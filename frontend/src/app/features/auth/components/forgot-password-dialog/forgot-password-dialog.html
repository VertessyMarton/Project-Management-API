<p-dialog
    [visible]="visible()"
    (visibleChange)="!$event && close()"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [dismissableMask]="false"
    [closeOnEscape]="!isSubmitting()"
    [showHeader]="false"
    [contentStyle]="{ padding: '0' }"
    [maskStyle]="{ background: 'rgba(0, 0, 0, 0.68)', backdropFilter: 'blur(3px)', '-webkit-backdrop-filter': 'blur(3px)' }"
    [style]="{ width: '420px', maxWidth: 'calc(100vw - 2rem)', background: '#191A1E', border: '1px solid #383A42', borderRadius: '16px', boxShadow: '0 24px 70px rgba(0,0,0,0.45)', color: '#f4f4f5' }"
    ariaLabelledBy="forgot-password-title"
>
    <div class="forgot-password-content">
        <button type="button" class="close-button" aria-label="Close password reset" [disabled]="isSubmitting()" (click)="close()">
            <i class="pi pi-times" aria-hidden="true"></i>
        </button>
        <div class="mail-icon" aria-hidden="true"><i class="pi pi-envelope"></i></div>
        <h2 id="forgot-password-title">Reset your password</h2>
        <p id="forgot-password-description" class="description">Enter your email address and we'll send you a link to reset your password.</p>

        <form #resetForm="ngForm" (ngSubmit)="resetForm.valid && onSubmit()">
            <label for="forgot-password-email">Email</label>
            <input id="forgot-password-email" name="email" type="email" autocomplete="email" placeholder="Email address"
                required email [ngModel]="email()" (ngModelChange)="email.set($event)"
                aria-describedby="forgot-password-description" [readOnly]="isSubmitting()" />
            @if (message(); as currentMessage) {
                <p [attr.role]="currentMessage.type === 'error' ? 'alert' : 'status'"
                    class="mt-3 text-sm leading-relaxed"
                    [style.color]="currentMessage.type === 'error' ? '#fca5a5' : '#6ee7b7'">
                    {{ currentMessage.text }}
                </p>
            }
            <button type="submit" class="send-button" [disabled]="resetForm.invalid || isSubmitting()">
                {{ isSubmitting() ? 'Sending link...' : 'Send reset link' }}
            </button>
        </form>
        <button type="button" class="back-button" [disabled]="isSubmitting()" (click)="close()">Back to sign in</button>
    </div>
</p-dialog>
