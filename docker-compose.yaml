services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: on-failure:5
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      EMAIL_PROVIDER: console
      PASSWORD_RESET_URL: http://localhost:8080/reset-password
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: project_manager
      DB_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "node node_modules/typeorm/cli.js migration:run -d dist/data-source.js && npm run start:prod",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3000/api/health/db").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_manager
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_manager"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
